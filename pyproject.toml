[project]
name = "shottracer"
version = "0.1.0"
description = "Semi-automatic golf shot tracer: draws the ball flight onto a golf video"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.150.0",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shottracer = "shottracer.cli:main"
shottracer-ui = "shottracer.server:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
